name: Build Iris

on:
  workflow_call:
    outputs:
      tag_name:
        value: ${{ jobs.build-and-release.outputs.tag_name }}
      jar_name:
        value: ${{ jobs.build-and-release.outputs.jar_name }}
      download_url:
        value: ${{ jobs.build-and-release.outputs.download_url }}
      file_size:
        value: ${{ jobs.build-and-release.outputs.file_size }}

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

jobs:
  # Defines a job with the ID 'build-and-release'.
  build-and-release:
    # The type of runner that the job will run on. 'ubuntu-latest' is a good default.
    runs-on: ubuntu-latest

    # These permissions are necessary for the action to create a release and upload assets.
    permissions:
      contents: write

    outputs:
      tag_name: ${{ steps.release-info.outputs.tag_name }}
      jar_name: ${{ steps.locate-jar.outputs.jar_name }}
      download_url: ${{ steps.release-info.outputs.download_url }}
      file_size: ${{ steps.locate-jar.outputs.file_size }}

    # A sequence of tasks that will be executed as part of the job.
    steps:
      # Step 1: Check out the repository code.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: 'VolmitSoftware/Iris'
          path: 'Iris'

      # Step 2: Set up the Java environment.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' # A popular, open-source distribution of OpenJDK.
          cache: 'gradle' # Caches Gradle dependencies to speed up future builds.

      # Step 3: Make the Gradle wrapper executable.
      - name: Grant execute permission to gradlew
        working-directory: ./Iris
        run: chmod +x ./gradlew

      # Step 4: Build the project using the Gradle wrapper.
      - name: Build with Gradle
        working-directory: ./Iris
        run: ./gradlew iris

      # Step 5: Locate the built jar (its name includes the dynamic version number).
      - name: Locate JAR
        id: locate-jar
        working-directory: ./Iris
        run: |
          JAR_PATH=$(find build -maxdepth 1 -name 'Iris-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)
          echo "jar_name=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"
          echo "file_size=$(stat -c%s "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      # Step 6: Compute release metadata for this build
      - name: Prepare release metadata
        id: release-info
        run: |
          TAG="iris-build-${{ github.run_number }}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "download_url=https://github.com/${{ github.repository }}/releases/download/$TAG/${{ steps.locate-jar.outputs.jar_name }}" >> "$GITHUB_OUTPUT"

      # Step 7: Create a GitHub Release and upload the build artifact.
      - name: Create Release and Upload Artifact
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release-info.outputs.tag_name }}
          name: Iris Bild No. ${{ github.run_number }}
          body: |
            Automated daily iris build generated by GitHub Actions.
            - **Commit:** `${{ github.sha }}`
            - **Triggered by:** `${{ github.event_name }}`
          files: |
            Iris/build/${{ steps.locate-jar.outputs.jar_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
