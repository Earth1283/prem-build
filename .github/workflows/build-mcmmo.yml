name: Build mcMMO

on:
  workflow_call:
    outputs:
      tag_name:
        value: ${{ jobs.build-and-release.outputs.tag_name }}
      jar_name:
        value: ${{ jobs.build-and-release.outputs.jar_name }}
      download_url:
        value: ${{ jobs.build-and-release.outputs.download_url }}
      file_size:
        value: ${{ jobs.build-and-release.outputs.file_size }}

  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      tag_name: ${{ steps.release-info.outputs.tag_name }}
      jar_name: ${{ steps.release-info.outputs.jar_name }}
      download_url: ${{ steps.release-info.outputs.download_url }}
      file_size: ${{ steps.release-info.outputs.file_size }}

    steps:
      # Step 1: Clone the repo and prep for build
      - name: Clone mcMMO repository
        run: git clone https://github.com/mcMMO-Dev/mcMMO.git

      # Step 2: Set up the Java environment required for building
      # mcMMO requires Java 17
      # but we will use 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Cache Maven packages to speed up future builds
          cache: 'maven'

      # Step 3: Build the project with Maven
      - name: Build with Maven
        run: |
          cd mcMMO
          mvn -B package --file pom.xml

      # Step 4: Compute release metadata for this build
      - name: Prepare release metadata
        id: release-info
        run: |
          JAR_PATH="mcMMO/target/mcMMO.jar"
          TAG="mcMMO-build-${{ github.run_number }}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"
          echo "file_size=$(stat -c%s "$JAR_PATH")" >> "$GITHUB_OUTPUT"
          echo "download_url=https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      # Step 5: Create the GitHub Release and upload the artifact
      # This uses the popular `softprops/action-gh-release` action
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          # The tag name for the release. Uses the run number to ensure uniqueness.
          tag_name: ${{ steps.release-info.outputs.tag_name }}

          name: mcMMO Build ${{ github.run_number }}

          # A description for the release body.
          body: |
            This is an automated build of mcMMO.
            Triggered by commit: ${{ github.sha }}

          # Specifies the files to upload as release assets.
          files: mcMMO/target/mcMMO.jar
