name: Build Nascraft

on:
  workflow_call:
    outputs:
      tag_name:
        value: ${{ jobs.build-and-release.outputs.tag_name }}
      jar_name:
        value: ${{ jobs.build-and-release.outputs.jar_name }}
      download_url:
        value: ${{ jobs.build-and-release.outputs.download_url }}
      file_size:
        value: ${{ jobs.build-and-release.outputs.file_size }}

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      tag_name: ${{ steps.release-info.outputs.tag_name }}
      jar_name: ${{ steps.locate-jar.outputs.jar_name }}
      download_url: ${{ steps.release-info.outputs.download_url }}
      file_size: ${{ steps.locate-jar.outputs.file_size }}

    steps:
      # Checkout Nascraft source code
      - name: Checkout Nascraft
        uses: actions/checkout@v4
        with:
          repository: 'Bounser/Nascraft'
          path: nascraft-source
          fetch-depth: 0

      # Set up JDK 21 and cache Gradle dependencies
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # Grant execute permission for gradlew
      - name: Make gradlew executable
        working-directory: ./nascraft-source
        run: chmod +x ./gradlew

      # Build with Gradle
      - name: Build with Gradle
        working-directory: ./nascraft-source
        run: ./gradlew clean build -x test

      # Find the built JAR
      - name: Locate JAR
        id: locate-jar
        working-directory: ./nascraft-source
        run: |
          JAR_PATH=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)
          echo "jar_name=${JAR_PATH##*/}" >> $GITHUB_OUTPUT
          echo "jar_path=$PWD/$JAR_PATH" >> $GITHUB_OUTPUT
          echo "file_size=$(stat -c%s "$JAR_PATH")" >> $GITHUB_OUTPUT

      # Generate release info with proper formatting
      - name: Generate release info
        id: release-info
        run: |
          RELEASE_DATE=$(date +'%Y-%m-%d')
          BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          cat << EOF > release_body.md
          Automated build of Nascraft
          - Commit: ${{ github.sha }}
          - Java: 21
          - Build date: $BUILD_DATE
          EOF

          TAG="nascraft-build-${{ github.run_number }}"
          echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "download_url=https://github.com/${{ github.repository }}/releases/download/$TAG/${{ steps.locate-jar.outputs.jar_name }}" >> $GITHUB_OUTPUT

      # Create release using the body file
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release-info.outputs.tag_name }}
          name: "Nascraft At ${{ steps.release-info.outputs.release_date }}"
          body_path: release_body.md
          files: |
            ${{ steps.locate-jar.outputs.jar_path }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
